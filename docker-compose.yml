version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gmvmax-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gmvmaxos
    volumes:
      - gmvmax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gmvmax-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmvmax-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gmvmaxos?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - MOCK_TIKTOK_API=false
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISABLE_TELEGRAM_ALERTS=${DISABLE_TELEGRAM_ALERTS}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmvmax-cron
    command: ["npx", "tsx", "src/cron-worker.ts"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gmvmaxos?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - MOCK_TIKTOK_API=false
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISABLE_TELEGRAM_ALERTS=${DISABLE_TELEGRAM_ALERTS}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gmvmax_postgres_data:
  redis_data:
